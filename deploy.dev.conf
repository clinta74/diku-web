# Development Configuration
# Source this file before running deploy.sh
#
# Usage: source deploy.dev.conf && ./deploy.sh dev

POSTGRES_DB=muwbta-dev
POSTGRES_USER=muwbta
POSTGRES_PASSWORD=dev-password
REGISTRY=localhost
IMAGE_REPO=muwbta
MUWBTA_IMAGE_TAG=dev
MUWBTA_ENV=Development
CLIENT_PORT=3000
LOG_LEVEL=Debug
MAX_CHARACTERS=10
MAX_SESSIONS=200
SESSION_TIMEOUT=20160
LINKDEAD_GRACE=30
STARTING_ROOM=hall@0.0.0
SWAGGER_ENABLED=true
ADMINER_PORT=127.0.0.1:8080   # Adminer enabled
WEB_DEBUG_PORT=127.0.0.1:5001  # Backend debugging enabled