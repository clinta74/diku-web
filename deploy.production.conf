# Production Configuration
# Source this file before running deploy.sh
#
# Usage: source deploy.production.conf && ./deploy.sh

POSTGRES_DB=dikuweb
POSTGRES_USER=dikuweb
POSTGRES_PASSWORD=your-production-password-here
REGISTRY=ghcr.io
IMAGE_REPO=your-org/diku-web
DIKUWEB_IMAGE_TAG=v1.0.0
DIKUWEB_ENV=Production
CLIENT_PORT=80
LOG_LEVEL=Warning
MAX_CHARACTERS=5
MAX_SESSIONS=100
SESSION_TIMEOUT=20160
LINKDEAD_GRACE=30
STARTING_ROOM=hall@0.0.0
SWAGGER_ENABLED=false
ADMINER_PORT=        # Empty = disabled
WEB_DEBUG_PORT=      # Empty = disabled