# GPU passthrough for the builder assist's Ollama, as an overlay rather than an edit.
#
#   docker compose -f docker-compose.truenas.yml -f docker-compose.truenas.gpu.yml up -d ollama
#
# An overlay because a device reservation the host cannot satisfy does not degrade - the container
# refuses to start. Keeping it separate means the base file always works, on a box with a card and
# on a box without one, and turning the GPU on is a deliberate act with a visible command rather
# than an edit somebody has to remember to undo.
#
# ---------------------------------------------------------------------------
# Before this will work
# ---------------------------------------------------------------------------
#
# TrueNAS SCALE ships the NVIDIA driver but does not install it by default. In Apps → Settings
# there is an install-drivers option; that also brings in the container toolkit that lets Docker
# hand a device to a container. Verify on the host BEFORE trying this file:
#
#   nvidia-smi                       # the host can see the card
#   docker info | grep -i runtime    # `nvidia` appears among the runtimes
#
# If either is missing, this overlay will only produce a container that will not start, which is a
# confusing way to learn the driver is absent.

services:
  ollama:
    # The modern spelling. `runtime: nvidia` still works and is what older guides show, but it is
    # the deprecated form and does not let you say which devices or how many.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      # Everything the base file sets is kept - compose merges maps rather than replacing them -
      # and these are the two that only make sense once there is a card.
      #
      # Halves the KV cache, which on a small card buys layers. A 6 GB 1060 holds about 4.5 GB of
      # weights once the cache is accounted for, so the ~650 MB this frees is worth roughly four
      # more of the 48 layers. On a card that fits the whole model it buys nothing and can come
      # out.
      #
      # Quantised KV requires flash attention, which is why the two go together.
      OLLAMA_FLASH_ATTENTION: '1'
      OLLAMA_KV_CACHE_TYPE: q8_0

    # Unchanged on purpose: cpus and OLLAMA_NUM_THREAD stay where the base file put them.
    #
    # A card that cannot hold the whole model does not stop the CPU working - the layers that did
    # not fit are still evaluated on it, for every token. So the reason those limits exist, which
    # is keeping a generation from competing with the game loop for all six cores, applies exactly
    # as it did before. They are worth revisiting only if a card ever holds the model outright.
    #
    # mem_limit likewise. Partial offload splits the weights; it does not remove them from RAM.

# ---------------------------------------------------------------------------
# Verifying it took
# ---------------------------------------------------------------------------
#
#   docker exec muwbta-ollama nvidia-smi
#       The card, from inside the container. If this fails the reservation did not work and
#       nothing below will tell you anything useful.
#
#   docker exec muwbta-ollama ollama ps
#       Load a model first (ask for a draft, or run create-models.sh). The PROCESSOR column is the
#       answer: "100% CPU" means the card is present but unused, "38%/62% CPU/GPU" is a partial
#       offload, "100% GPU" is the whole model resident. On a 6 GB card against 8.1 GB of weights,
#       expect partial - that is the arithmetic, not a fault.
#
#   docker logs muwbta-web | grep -i "assist warm"
#       What it was actually worth. The warm-up prefills the whole canon, and prefill is the part
#       a GPU helps most with - it is compute-bound where generation is bandwidth-bound. Measured
#       on CPU alone that step took about half an hour.
