# NO SECRETS IN THIS FILE. Every password below is deliberately empty and is set in the TrueNAS
# app's own environment instead. This file is committed to a public repository; an earlier revision
# of it carried the live beta passwords in plain text, and they had to be rotated because of it.
# If you paste a password in here to make something work, you have made that mistake again.
#
# diku-web - beta, on TrueNAS SCALE as a custom app.
#
# CONFIG TRAVELS IN IMAGES, NOT IN BIND MOUNTS. A TrueNAS custom app renders this file on its own,
# with no git checkout beside it, so a relative source like ./tools/backup resolved to a path that
# did not exist - and Docker CREATES A MISSING BIND SOURCE AS AN EMPTY DIRECTORY rather than
# failing. That failed loudly exactly once, on prometheus.yml, because it is the only bind source
# that was a file and Docker cannot mount a directory onto a file. The other six were directories,
# created empty, and nothing complained. The worst of them was ./tools/backup -> /scripts, whose
# entrypoint is /bin/sh /scripts/backup.sh: the script was not there, the sidecar never started,
# and backups had never once run.
#
# So prometheus.yml, the Grafana provisioning and dashboards, and backup.sh are baked into
# dikuweb-prometheus, dikuweb-grafana and dikuweb-backup. They arrive with the image or the image
# does not build. Nothing needs copying to the NAS.
#
# WHAT REMAINS A BIND IS DATA, NOT CONFIG - dumps, logs, and the ollama model cache have to outlive
# a container. All four are long-form with `create_host_path: false`, so a wrong path fails to
# start with a clear message instead of quietly mounting an empty directory.
#
# NO LOOPBACK PUBLISHES. `127.0.0.1:port:port` binds the NAS's own loopback, which is reachable
# from a shell on the NAS and from nowhere else - not from a workstation, and not through the
# TrueNAS app UI. Every published port here is on all interfaces on purpose. That is also why the
# passwords below matter: postgres and Grafana are reachable from the LAN.
#
# BEFORE FIRST DEPLOY: /mnt/ssd/dikuweb has to exist, and that is the whole list. Make it a
# dataset in the TrueNAS UI, or `mkdir /mnt/ssd/dikuweb`. Everything under it is created by the
# containers - backup.sh runs `mkdir -p "$BACKUP_DIR"` and then refuses to continue if the result
# is inside the container instead of on a volume, which is a better check than anything this file
# could assert. There is no /app/logs mount because nothing writes there; container output goes to
# the json-file driver configured on every service.
#
# If the earlier failed deploy left them behind, delete the empty directories Docker invented under
# /mnt/.ix-apps/app_configs/dikumud-web/versions/*/templates/rendered/ first.

name: diku-web

# The one host path this deployment needs. Everything under it is created by the containers
# themselves - see backup.sh, which does `mkdir -p "$BACKUP_DIR"` and then refuses to run if the
# result turns out to be inside the container rather than on a volume. Anchored so the NAS location
# is a single edit rather than one per service.
x-data-volume: &data-volume
  type: bind
  source: /mnt/ssd/dikuweb
  target: /data
  bind:
    create_host_path: false
networks:
  dikuweb-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
services:
  backup:
    container_name: dikuweb-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_AT_HOUR: '3'
      BACKUP_DIR: /data/backups
      BACKUP_KEEP: '30'
      PGDATABASE: dikuweb
      PGHOST: postgres
      PGPASSWORD:
      PGUSER: dikuweb
    image: candrews74/dikuweb-backup:latest
    logging:
      driver: json-file
      options:
        labels: service=backup
        max-file: '3'
        max-size: 10m
    mem_limit: 1g
    networks:
      - dikuweb-network
    restart: always
    volumes:
      - *data-volume
  client:
    container_name: dikuweb-client
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
        - CMD
        - wget
        - '-q'
        - '-O'
        - '-'
        - http://localhost/health
      timeout: 10s
    image: candrews74/dikuweb-client:latest
    logging:
      driver: json-file
      options:
        labels: service=client
        max-file: '3'
        max-size: 50m
    mem_limit: 128m
    networks:
      - dikuweb-network
    ports:
      - '7180:80'
    pull_policy: always
    restart: always
  ollama:
    container_name: dikuweb-ollama
    cpus: 4
    environment:
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_MAX_LOADED_MODELS: '2'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_NUM_THREAD: '4'
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD
        - ollama
        - list
      timeout: 10s
    image: ollama/ollama:latest
    logging:
      driver: json-file
      options:
        labels: service=ollama
        max-file: '3'
        max-size: 10m
    mem_limit: 12g
    networks:
      - dikuweb-network
    pull_policy: always
    restart: always
    volumes:
      - type: bind
        source: /mnt/ssd/ollama
        target: /root/.ollama
        bind:
          create_host_path: false
  postgres:
    container_name: dikuweb-postgres
    environment:
      POSTGRES_DB: dikuweb
      POSTGRES_INITDB_ARGS: '-c timezone=UTC -c shared_buffers=256MB -c max_connections=200'
      POSTGRES_PASSWORD:
      POSTGRES_USER: dikuweb
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 15s
      test:
        - CMD-SHELL
        - pg_isready -U dikuweb -d dikuweb
      timeout: 5s
    image: postgres:18
    logging:
      driver: json-file
      options:
        labels: service=postgres
        max-file: '3'
        max-size: 10m
    mem_limit: 2g
    networks:
      - dikuweb-network
    ports:
      # Not 127.0.0.1:5434 - that binds the NAS's own loopback and is reachable only
      # from a shell on the NAS. Open on the LAN, which is what makes the password
      # above load-bearing rather than decorative.
      - '5434:5432'
    restart: always
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql
      - *data-volume
  
  prometheus:
    # Scrapes web:8080/metrics (PLAN.md §8, Phase 6). See tools/monitoring/prometheus.yml.
    #
    # No published port at all, which is the right answer here rather than a loopback binding:
    # /metrics is unauthenticated and so is this UI, and both are reachable from inside the
    # compose network only. Grafana queries it over dikuweb-network. To look at raw series, add a
    # plain '9090:9090' mapping temporarily - a 127.0.0.1 one would bind the NAS's loopback and be
    # reachable from nowhere useful.
    image: candrews74/dikuweb-prometheus:latest
    container_name: dikuweb-prometheus
    restart: always
    networks:
      - dikuweb-network
    volumes:
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 90 days. The point of a histogram over a log line is answering "is it getting worse",
      # and that question needs more history than an incident does.
      - --storage.tsdb.retention.time=90d
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=prometheus"

  grafana:
    # The dashboard. Provisioned from tools/monitoring/grafana, so it survives a container
    # recreate and lives in git rather than only in Grafana's own database.
    image: candrews74/dikuweb-grafana:latest
    container_name: dikuweb-grafana
    restart: always
    networks:
      - dikuweb-network
    depends_on:
      - prometheus
    ports:
      # On all interfaces, because a 127.0.0.1 publish binds the NAS's own loopback and cannot be
      # reached from a workstation. This UI is therefore open on the LAN, so the admin password
      # below is the only thing in front of it - it is not decoration, and it does not belong in
      # a public repository.
      - "3000:3000"
    environment:
      # Set in the TrueNAS app's environment, not here. This UI is published on the LAN.
      GF_SECURITY_ADMIN_PASSWORD:
      # Nobody is signing up for a metrics dashboard for one server.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=grafana"

  web:
    container_name: dikuweb-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Assist__BaseUrl: http://ollama:11434
      Assist__Enabled: 'true'
      Assist__Model: dikuweb-builder
      Assist__WarmUpOnStart: True
      Assist__WarmUpTimeoutSeconds: 3600
      Auth__CookieName: dikuweb.session
      Auth__SessionTimeoutMinutes: '20160'
      DatabaseConnection__Database: dikuweb
      DatabaseConnection__Host: postgres
      DatabaseConnection__Password:
      DatabaseConnection__Port: '5432'
      DatabaseConnection__User: dikuweb
      Engine__LinkDeadGraceSeconds: '300'
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      # Two different limits, and the names have to be exact - the binder ignores a key it does
      # not recognise, so a misspelling takes effect nowhere and says nothing.
      #
      # How many characters this account may have at all:
      Sessions__MaxCharactersPerAccount: '8'
      # How many of them may be in the world at once, each holding an SSE connection:
      Sessions__MaxConcurrentCharactersPerAccount: '3'
      #
      # How long a client may go quiet before it is treated as link-dead. The client beats every
      # 20s, so this is three missed beats. Zero disables the sweep, and the server then falls back
      # to noticing a dropped connection only when the kernel gives up retransmitting - measured at
      # over sixteen minutes, proxy or no proxy (PLAN.md 11).
      Sessions__HeartbeatTimeoutSeconds: '60'
      #
      # There is deliberately no global session cap. Sessions__MaxConcurrentSessions: '100' used to
      # sit here and bound to nothing - there is no such setting, so it read as a hundred-session
      # ceiling while none was in force - and a hundred would now contradict PLAN.md 11, which
      # targets 200 concurrent sessions on one process and has measured them being held.
      SwaggerEnabled: 'false'
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test:
        - CMD
        - curl
        - '-f'
        - http://localhost:8080/health
      timeout: 10s
    image: candrews74/dikuweb-server:latest
    logging:
      driver: json-file
      options:
        labels: service=web
        max-file: '5'
        max-size: 50m
    mem_limit: 2g
    networks:
      - dikuweb-network
    pull_policy: always
    restart: always
volumes:
  pgdata:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local