name: diku-web-dev

# Local development docker-compose
# Runs only PostgreSQL database for local development
# Run the .NET server and React client locally with dotnet and npm

services:
  postgres:
    # PostgreSQL 18 - same as production
    image: postgres:18
    container_name: dikuweb-postgres
    restart: unless-stopped
    networks:
      - dikuweb-network
    environment:
      POSTGRES_DB: ${DB_NAME:-dikuweb}
      POSTGRES_USER: ${DB_USER:-dikuweb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: >-
        -c timezone=UTC
        -c shared_buffers=256MB
        -c max_connections=200
    ports:
      # Expose to localhost for local development
      - "127.0.0.1:5432:5432"
    volumes:
      # Persist data between runs
      - pgdata:/var/lib/postgresql
      - ./backups:/backups:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dikuweb} -d ${DB_NAME:-dikuweb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    shm_size: 256mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres"

  # Optional: Database admin UI for development
  adminer:
    image: adminer:4
    container_name: dikuweb-adminer
    restart: unless-stopped
    networks:
      - dikuweb-network
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Web UI for database browsing/editing
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: ${DB_NAME:-dikuweb}
      ADMINER_DEFAULT_USER: ${DB_USER:-dikuweb}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
        labels: "service=adminer"

networks:
  dikuweb-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  pgdata:
    driver: local
