name: diku-web

services:
  postgres:
    # PLAN.md §6: PostgreSQL 18, pinned here and in the Testcontainers image tag
    # so dev, test, and prod agree. Chosen for the support window (Nov 2030) and uuidv7().
    image: postgres:18
    container_name: dikuweb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dikuweb}
      POSTGRES_USER: ${POSTGRES_USER:-dikuweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dikuweb_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18+ stores data in a major-version subdirectory (/var/lib/postgresql/18/docker)
      # so that pg_upgrade --link works without crossing a mount boundary. Mounting at
      # /var/lib/postgresql/data (correct through PG 17) makes the container refuse to start.
      # See https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Adminer waits on this, and so does the Testcontainers-free local workflow.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dikuweb} -d ${POSTGRES_DB:-dikuweb}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  adminer:
    image: adminer:5
    container_name: dikuweb-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
