name: muwbta-dev

# Local development docker-compose
#
# Runs PostgreSQL (and Adminer) for local development; the .NET server and the React client run on
# the host with `dotnet` and `npm`.
#
# The builder's AI assist is here too, behind a profile, because it is 8 GB of model and half an
# hour of first-run prefill and nobody wanting a database should pay for that by accident:
#
#     docker compose up -d                      # postgres + adminer, as before
#     docker compose --profile assist up -d     # ...and ollama, on the CPU
#
# If this machine has a usable GPU, layer docker-compose.gpu.yml over this one - the assist is
# perfectly usable without it and unrecognisably faster with it.
#
# After the first `--profile assist` start, build the derived model once:
#
#     sh tools/ollama/create-models.sh
#
# Credentials come from .env (see .env.example). The default password here matches the connection
# string in appsettings.Development.json, so a checkout with no .env at all still works - but note
# that Postgres reads POSTGRES_PASSWORD only when it initialises an empty data directory. Changing
# it later changes nothing until the `pgdata` volume is recreated or the role is altered by hand.
#
# appsettings.Development.json already points the server at http://localhost:11434 and the model
# `muwbta-builder`, so nothing else needs configuring - which is also why ollama's port is
# published here and deliberately is not on the NAS: there, `web` is a container on the compose
# network and reaches it by service name. Here the server is on the host.

services:
  postgres:
    # PostgreSQL 18 - same as production
    image: postgres:18
    container_name: muwbta-postgres
    restart: unless-stopped
    networks:
      - muwbta-network
    environment:
      # POSTGRES_*, matching the names the container itself uses, the names deploy.dev.conf uses,
      # and the names the prod and NAS compose files use.
      #
      # These were DB_NAME/DB_USER/DB_PASSWORD, which nothing else in the repository said, and the
      # failure was silent in the worst way: `${DB_PASSWORD:-password}` against a .env written in
      # the other dialect resolves happily to "password", so Postgres initialised with a password
      # the .env never mentioned and appsettings.Development.json did not share. Nothing errored;
      # the server simply could not authenticate.
      POSTGRES_DB: ${POSTGRES_DB:-muwbta}
      POSTGRES_USER: ${POSTGRES_USER:-muwbta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muwbta_dev_only}
      POSTGRES_INITDB_ARGS: >-
        -c timezone=UTC
        -c shared_buffers=256MB
        -c max_connections=200
    ports:
      # Loopback only; the port is a variable because 5432 is often already taken by a Postgres
      # somebody installed natively, and .env was already setting this and being ignored.
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      # Persist data between runs
      - pgdata:/var/lib/postgresql
      - ./backups:/backups:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-muwbta} -d ${POSTGRES_DB:-muwbta}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    shm_size: 256mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres"

  # Optional: Database admin UI for development
  adminer:
    image: adminer:4
    container_name: muwbta-adminer
    restart: unless-stopped
    networks:
      - muwbta-network
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Web UI for database browsing/editing.
      - ${ADMINER_PORT:-8080}:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: ${POSTGRES_DB:-muwbta}
      ADMINER_DEFAULT_USER: ${POSTGRES_USER:-muwbta}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
        labels: "service=adminer"

  # The builder's AI assist. Opt-in: `--profile assist`.
  #
  # Not in any depends_on chain, here or on the NAS: the MUD starts and runs whether or not
  # inference is available, and the assist endpoints answer "not configured" rather than failing.
  ollama:
    image: ollama/ollama:latest
    container_name: muwbta-ollama
    profiles:
      - assist
    restart: unless-stopped
    networks:
      - muwbta-network
    ports:
      # Loopback, and published unlike the NAS deployment - the server runs on the host here, so
      # there is no compose network for it to reach ollama across. This is the address
      # appsettings.Development.json already uses.
      - 11434:11434
    environment:
      # Never unload. The default is 5m, and an unload discards the KV cache for the canon prefix
      # - which is the whole cost this design is built around (tools/ollama/README.md).
      OLLAMA_KEEP_ALIVE: '-1'
      # Generation model + embedding model resident at once.
      OLLAMA_MAX_LOADED_MODELS: '2'
      # One slot. Parallel slots divide the context window between them and fragment prefix
      # caching, and this design depends on one large prefix hitting every request.
      OLLAMA_NUM_PARALLEL: '1'
      # Matching the cpus limit below. Both are variables because a dev machine is not a known
      # quantity the way the NAS is; the default leaves a couple of cores for the compiler and
      # the game you are testing against.
      OLLAMA_NUM_THREAD: ${OLLAMA_THREADS:-4}
    cpus: ${OLLAMA_CPUS:-4.0}
    # Gemma 3 12B Q4 is ~8.1 GB of weights, plus KV cache and headroom. Lower this on a smaller
    # machine and the model will not load rather than swapping; raise it if you run a bigger one.
    mem_limit: ${OLLAMA_MEMORY:-12g}
    volumes:
      # A named volume, so `docker compose down` does not throw away the 8 GB you just pulled.
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=ollama"

networks:
  muwbta-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  pgdata:
    driver: local
  ollamadata:
    driver: local
