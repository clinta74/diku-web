# Staging Configuration
# Source this file before running deploy.sh
#
# Usage: source deploy.staging.conf && ./deploy.sh staging

POSTGRES_DB=dikuweb-staging
POSTGRES_USER=dikuweb
POSTGRES_PASSWORD=staging-password
REGISTRY=ghcr.io
IMAGE_REPO=your-org/diku-web
DIKUWEB_IMAGE_TAG=main
DIKUWEB_ENV=Staging
CLIENT_PORT=8080
LOG_LEVEL=Information
MAX_CHARACTERS=5
MAX_SESSIONS=100
SESSION_TIMEOUT=20160
LINKDEAD_GRACE=30
STARTING_ROOM=hall@0.0.0
SWAGGER_ENABLED=true
ADMINER_PORT=127.0.0.1:8081   # Adminer enabled in staging
WEB_DEBUG_PORT=127.0.0.1:5001  # Backend debugging enabled