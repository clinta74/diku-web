name: Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

# Docker Hub rather than ghcr.io: these images are pulled by compose files on hosts that already
# authenticate to Docker Hub. Credentials come from the DOCKER_USERNAME / DOCKER_PASSWORD repo
# secrets, and the namespace is derived from the username so there is one place to change it.
env:
  IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history and tags, because `Resolve build version` runs `git describe`. The
          # default shallow checkout has neither, and git describe would fail to a bare 0.0.0
          # every time - silently, since the fallback looks like a legitimate answer.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests, which do not push. A fork's PR has no access to the secrets
      # anyway, so attempting the login there fails for a reason unrelated to the change.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (backend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/muwbta-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Branch builds only. On a tag push {{branch}} renders empty and the tag
            # becomes ":-<sha>", which is not a valid reference - the build fails before
            # it starts. Nothing caught it because no tag had ever been pushed.
            type=sha,prefix={{branch}}-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=raw,value=latest,enable={{is_default_branch}}

      # metadata-action's version output is the tag text, which for a branch build is the branch
      # name - and `<Version>main</Version>` is not a version MSBuild will take. Resolved here
      # instead.
      #
      # A branch build reports its DISTANCE FROM THE LAST TAG rather than 0.0.0. It used to say
      # 0.0.0, which meant /api/version fell back to showing a commit hash - and since `latest`
      # only ever comes from a branch build, deploying `latest` could never show a version at all.
      # `1.0.1-dev.4` says what a hash cannot: which release you are past, and by how much.
      - name: Resolve build version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            # --abbrev=0 gives the tag itself; without any tag at all, start from 0.0.0.
            last="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            count="$(git rev-list --count "${last}..HEAD" 2>/dev/null || git rev-list --count HEAD)"
            version="${last#v}-dev.${count}"
          fi
          echo "resolved $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
          # No provenance or SBOM attestations. Buildx attaches both by default, and each one
          # adds a second manifest to the tag with platform "unknown/unknown" - which turns the
          # tag from a plain image into an OCI index. A puller stores the image under the
          # *platform* manifest's digest while the tag resolves to the *index* digest, so anything
          # comparing "what I have" against "what the tag points to" sees two different values
          # forever, including immediately after a successful pull. That is why TrueNAS reported
          # an update available on every check, updated correctly, and then reported one again.
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/muwbta-server:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/muwbta-server:buildcache,mode=max', env.IMAGE_NAMESPACE) || '' }}

  build-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (client)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/muwbta-client
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Branch builds only. On a tag push {{branch}} renders empty and the tag
            # becomes ":-<sha>", which is not a valid reference - the build fails before
            # it starts. Nothing caught it because no tag had ever been pushed.
            type=sha,prefix={{branch}}-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push client
        uses: docker/build-push-action@v5
        with:
          # ./client, not the repo root. client/Dockerfile copies package.json and tsconfig*.json
          # from the context root, and there is no package.json at the top of this repo - with the
          # root as context the very first COPY fails. It also means client/.dockerignore is the
          # one that applies, which is the file written for this image.
          context: ./client
          file: ./client/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No provenance or SBOM attestations. Buildx attaches both by default, and each one
          # adds a second manifest to the tag with platform "unknown/unknown" - which turns the
          # tag from a plain image into an OCI index. A puller stores the image under the
          # *platform* manifest's digest while the tag resolves to the *index* digest, so anything
          # comparing "what I have" against "what the tag points to" sees two different values
          # forever, including immediately after a successful pull. That is why TrueNAS reported
          # an update available on every check, updated correctly, and then reported one again.
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/muwbta-client:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/muwbta-client:buildcache,mode=max', env.IMAGE_NAMESPACE) || '' }}

  # The three sidecars that used to read their config off a bind mount. They now carry it, because
  # a TrueNAS custom app renders its compose file with no repository beside it - a relative bind
  # source resolves to nothing, and Docker creates a missing source as an empty directory instead
  # of failing. Six mounts did that silently; the backup sidecar's script was one of them, so
  # backups never ran at all.
  #
  # A matrix rather than three copies of the same twelve lines. They differ only in name, context
  # and dockerfile, and nothing here needs the .NET build the two jobs above do.
  build-sidecars:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: muwbta-backup
            context: ./tools/backup
            dockerfile: ./tools/backup/Dockerfile
          - name: muwbta-prometheus
            context: ./tools/monitoring
            dockerfile: ./tools/monitoring/Dockerfile.prometheus
          - name: muwbta-grafana
            context: ./tools/monitoring
            dockerfile: ./tools/monitoring/Dockerfile.grafana

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same reason as the two jobs above: an attestation turns the tag into an OCI index and
          # no digest comparison can match, which is what made TrueNAS report a permanent update.
          provenance: false
          sbom: false
