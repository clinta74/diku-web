name: Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

# Docker Hub rather than ghcr.io: these images are pulled by compose files on hosts that already
# authenticate to Docker Hub. Credentials come from the DOCKER_USERNAME / DOCKER_PASSWORD repo
# secrets, and the namespace is derived from the username so there is one place to change it.
env:
  IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests, which do not push. A fork's PR has no access to the secrets
      # anyway, so attempting the login there fails for a reason unrelated to the change.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (backend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/dikuweb-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # metadata-action's version output is the tag text, which for a branch build is the
      # branch name - and `<Version>main</Version>` is not a version MSBuild will take. Resolved
      # explicitly instead: a release tag supplies its own number, anything else is 0.0.0, which
      # is the honest answer for a build that is not a release.
      - name: Resolve build version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
          # No provenance or SBOM attestations. Buildx attaches both by default, and each one
          # adds a second manifest to the tag with platform "unknown/unknown" - which turns the
          # tag from a plain image into an OCI index. A puller stores the image under the
          # *platform* manifest's digest while the tag resolves to the *index* digest, so anything
          # comparing "what I have" against "what the tag points to" sees two different values
          # forever, including immediately after a successful pull. That is why TrueNAS reported
          # an update available on every check, updated correctly, and then reported one again.
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/dikuweb-server:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/dikuweb-server:buildcache,mode=max', env.IMAGE_NAMESPACE) || '' }}

  build-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (client)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/dikuweb-client
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push client
        uses: docker/build-push-action@v5
        with:
          # ./client, not the repo root. client/Dockerfile copies package.json and tsconfig*.json
          # from the context root, and there is no package.json at the top of this repo - with the
          # root as context the very first COPY fails. It also means client/.dockerignore is the
          # one that applies, which is the file written for this image.
          context: ./client
          file: ./client/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No provenance or SBOM attestations. Buildx attaches both by default, and each one
          # adds a second manifest to the tag with platform "unknown/unknown" - which turns the
          # tag from a plain image into an OCI index. A puller stores the image under the
          # *platform* manifest's digest while the tag resolves to the *index* digest, so anything
          # comparing "what I have" against "what the tag points to" sees two different values
          # forever, including immediately after a successful pull. That is why TrueNAS reported
          # an update available on every check, updated correctly, and then reported one again.
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/dikuweb-client:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/dikuweb-client:buildcache,mode=max', env.IMAGE_NAMESPACE) || '' }}
