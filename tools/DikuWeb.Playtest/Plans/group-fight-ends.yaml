name: A group fight ends
about: |
  The bug that only a second player could find, and the reason this apparatus was worth building.

  The rule for "is this fight still going" counted heads: two or more combatants meant a fight.
  That is correct for exactly one shape — one player against one mob, where the mob dying leaves
  one combatant. Two players on one mob is three; the mob dies, two remain, the count is still
  two, and the fight never ended. Everyone left was stuck Fighting, refused every later `kill` and
  unable to walk out of the room. It scaled with the party, and it was invisible solo, which is
  how it survived.

  Read the two columns side by side. Both players should be released at the same moment.

  **One** rat, deliberately, and that is the fixture doing something a hand-built world could not
  promise: two rats in the room would let `kill rat` resolve to a different one for each player,
  and the plan would quietly stop being about three combatants in one fight — which is the only
  shape that ever hung.

world:
  rooms:
    - key: aldenmoor.millbrook.tavern-common

  mobs:
    - key: city-rat
      name: a rat
      description: Wet fur, a tail like a bootlace, and no fear of anybody at all.
      icon: "r"
      room: aldenmoor.millbrook.tavern-common
      health: 12
      level: 1
      xp: 25
      gold: 3
      disposition: passive
      count: 1

cast:
  - name: Bram
    path: Warden
  - name: Kael
    path: Warden

steps:
  - note: Both walk to the tavern together.
    together:
      - { actor: Bram, do: south }
      - { actor: Kael, do: south }
  - note: ""
    together:
      - { actor: Bram, do: east }
      - { actor: Kael, do: east }
  - note: ""
    together:
      - { actor: Bram, do: south }
      - { actor: Kael, do: south }

  - actor: Bram
    wait: { text: "The Drowned Rat" }
    expect: "The Drowned Rat"
  - actor: Kael
    wait: { text: "The Drowned Rat" }
    expect: "The Drowned Rat"

  - actor: Bram
    note: Group first, so the kill is shared and the party path is the one under test.
    do: group invite Kael

  # A step's own `wait` runs *after* its command, so waiting for the invitation and accepting it
  # are two steps. Written as one, the accept would go out before the invitation had landed.
  - actor: Kael
    wait: { text: "join their group" }
    expect: "group accept"
  - actor: Kael
    do: group accept

  - actor: Bram
    wait: { text: "joins the group" }
    expect: "Kael joins the group"

  - note: Both attack the same rat. Three combatants, which is the shape that used to hang.
    together:
      - { actor: Bram, do: attack rat }
      - { actor: Kael, do: attack rat }

  - actor: Bram
    wait: { text: "falls", timeout: 120 }
    expect: "a rat falls"
  - actor: Kael
    wait: { text: "falls", timeout: 30 }
    expect: "a rat falls"

  - actor: Bram
    note: |
      The whole point: both must be released, not just whoever landed the blow.

      Checked by walking rather than by attacking, and the difference matters. `kill` looks up its
      target *before* it checks whether you are already fighting, so once the rat is dead
      "kill rat" answers "You don't see 'rat' here" and never reaches the check — the first
      version of this plan passed on that, which is to say it proved nothing. Movement is refused
      only for being in combat, so walking out is unambiguous.
    do: north
    wait: { text: "You walk north" }
    expect: "You walk north"
    expect-not: "while in combat"

  - actor: Kael
    do: north
    wait: { text: "You walk north" }
    expect: "You walk north"
    expect-not: "while in combat"
