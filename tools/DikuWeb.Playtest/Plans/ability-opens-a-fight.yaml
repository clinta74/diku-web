name: An ability opens a fight
about: |
  The playtesting note of 2026-08-09, as a player would hit it. Two things were wrong and both
  were invisible to the test suite, because every assertion about them passed:

    * The ability said "Your Kick takes effect!" — no target, no amount, no outcome. A player
      could not tell a hit from a miss.
    * A mob killed by an ability sat in the fight at zero health for ever. No experience, no
      loot, no corpse, and the player was stuck Fighting: refused every later `kill`, and unable
      to walk out of the room.

  Kick is the Warden's level-1 opener, so this needs no admin and no fixtures — a fresh character
  can run it. That is deliberate: the plan guarding the most-reported bug should have the fewest
  reasons not to run.

  Whether the kick kills outright is a dice roll — it is 1.1x damage with a floor of 3, against a
  city rat with barely more health than that. Both outcomes are worth having, so the plan waits for
  the rat to fall rather than assuming which one killed it:

    * one-shot, and the closing half of the note is on display — experience, gold, and a fight that
      ends;
    * survived, and so is the opening half, because the Warden's own weapon carries on and finishes
      it. A run where the kick rolled 9 instead of 10 caught exactly that: "Your Kick hits a rat for
      9." and then, two seconds later, "You hit a rat for 2 damage. A rat falls."

  An earlier version assumed the one-shot and flagged four expectations the first time the dice
  disagreed. Fixtures will make this deterministic by building a mob that reliably survives an
  opener; until then, waiting for the outcome rather than predicting it is the honest shape.

cast:
  - name: Theron
    path: Warden

steps:
  - actor: Theron
    do: south
    wait: { text: "You walk south" }
  - actor: Theron
    do: east
    wait: { text: "You walk east" }
  - actor: Theron
    do: south
    wait: { text: "The Drowned Rat" }

  - actor: Theron
    note: |
      Abilities are verbs. `cast kick` should be refused by naming the verb form — the refusal is
      the teaching, and it is the whole reason the split between spells and skills is visible to
      a player at all.
    do: cast kick rat
    expect:
      - "skill, not a spell"
      - "kick rat"
    expect-not: "You use Kick"

  - actor: Theron
    note: |
      The ability must say what it actually did: who it hit, and for how much.
    do: kick rat
    wait: { text: "Your Kick" }
    expect:
      - "You use Kick"
      - "Your Kick hits a rat for"
    expect-not: "takes effect"

  - actor: Theron
    note: |
      The kill has to be a whole kill, whichever blow lands it. Experience arriving is the visible
      half of HandleDeath having run at all — when an ability killed something, none of it used to.
    wait: { text: "a rat falls", timeout: 60 }
    expect:
      - "a rat falls"
      - "xp 25"

  - actor: Theron
    note: |
      And the fight has to be over. This is the exact check the bug failed: movement is refused
      while fighting, so walking out is the proof that a corpse is not still holding you in a
      fight that can never end.
    do: north
    wait: { text: "You walk north" }
    expect: "You walk north"
    expect-not: "while in combat"

  - actor: Theron
    note: The other thing a stuck fight prevents.
    do: south
    wait: { text: "The Drowned Rat" }
  - actor: Theron
    do: kill rat
    expect-not: "already in combat"
