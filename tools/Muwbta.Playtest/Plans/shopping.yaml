name: Shopping
about: |
  Buying and selling, and the accounting behind them.

  The baseline of two shop plans, and deliberately the one with no numbers in it: this covers the
  verbs existing at all and refusing properly. `shop-markup` covers what a shop *charges*, against
  a smith that prices over base value. The bar maiden here carries **no markup**, which is what
  makes the pair a contrast — leave her at base value.

  This plan wants an admin, and degrades honestly without one: money is granted with `set` rather
  than earned, because the alternative is killing rats for it and this world keeps one rat, in
  this room — a plan that competes with every other plan for the same mob is a plan that fails for
  reasons that have nothing to do with shops. Run with --admin-user/--admin-password to get the
  whole thing; without them the promotion is refused, it is recorded as a problem, and everything
  up to the first purchase still runs. Note that the same credential is what builds the shop.

world:
  rooms:
    - key: aldenmoor.millbrook.tavern-common

  items:
    - key: beer
      name: a mug of beer
      description: Brown, warm, and topped with a finger of foam that is mostly optimism.
      icon: "u"
      value: 6

  mobs:
    - key: bar-maiden
      name: the bar maiden
      description: |
        She has been pulling beer here since before the gate rusted, and can tell what you want
        before you have finished sitting down.
      icon: "b"
      room: aldenmoor.millbrook.tavern-common
      disposition: npc
      shopkeeper: true
      sells: [beer]

cast:
  - name: Overseer
    path: Warden
    role: Admin
  - name: Coin
    path: Warden

steps:
  - actor: Coin
    do: south
    wait: { text: "You walk south" }
  - actor: Coin
    do: east
    wait: { text: "You walk east" }
  - actor: Coin
    do: south
    wait: { text: "The Drowned Rat" }

  - actor: Coin
    note: |
      A shopkeeper is not something you can fight. Refusing in words rather than silently is the
      difference between a rule and a bug.
    do: attack bar maiden
    expect-not: "You begin attacking"

  - actor: Coin
    note: The stock list is the whole interface. It must name what is for sale and price it.
    do: list
    wait: { text: "beer" }
    expect: "beer"

  - actor: Coin
    note: |
      Buying with nothing should be refused clearly. A new character has no gold, so this is the
      empty-pocket case without having to arrange one.
    do: buy beer
    expect-not: "You buy"

  - actor: Overseer
    note: Money by fiat, so the rest of the plan is about the shop rather than about rats.
    do: set Coin gold 100
    expect: "gold"

  - actor: Coin
    do: buy beer
    wait: { text: "beer" }

  - actor: Coin
    note: What you paid for should be in your hands.
    do: inventory
    expect: "beer"

  - actor: Coin
    note: And selling it back should work, at whatever the shop pays for it.
    do: sell beer
    expect-not: "is not something you can do"

  - actor: Coin
    do: inventory
    expect-not: "beer"
