# Minimal nginx configuration for DikuWeb SPA + API proxy
# Serves React app on / and proxies /api to backend

user nginx-app;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main ''$remote_addr - $remote_user [$time_local] "$request" ''
                    ''$status $body_bytes_sent "$http_referer" ''
                    ''"$http_user_agent" "$http_x_forwarded_for"'';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    upstream backend {
        # Reference backend container by service name (docker-compose networking)
        server web:5000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint (for docker healthcheck)
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # API proxy - forward all /api requests to backend
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # Preserve original request info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            
            # For Server-Sent Events (game stream)
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # SPA routing: all requests not matching files/dirs go to index.html
        location / {
            # Try to serve files and directories, else index.html
            try_files $uri $uri/ /index.html;
            
            # Cache static assets (with hash in filename via Vite)
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache HTML files (so updates are picked up)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}